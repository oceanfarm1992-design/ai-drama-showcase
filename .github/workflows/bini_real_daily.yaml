name: Bini's Real Ocean Daily Episode

on:
  schedule:
    # One episode per day, narrators taking turns (see "Determine narrator").
    # Off the hour on purpose: GitHub's own docs warn crons pinned to :00 are
    # the most likely to be delayed/dropped under platform-wide load.
    - cron: '15 2 * * *'    # ~02:15 UTC
  workflow_dispatch:
    inputs:
      theme:
        description: 'Optional creature/theme seed'
        required: false
        default: ''
      character:
        description: 'Narrator: bini, tula, ollo, dodo, or pipi'
        required: false
        default: 'bini'

# Lets the automatic GITHUB_TOKEN create releases and commit the manifest.
permissions:
  contents: write

# One run at a time: a manual run overlapping a scheduled one would otherwise
# race on manifest.json. Later runs wait in line instead of being cancelled.
concurrency:
  group: real-ocean-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Determine narrator for this run
        id: narrator
        # Scheduled runs rotate through the five narrators by UTC day number,
        # so each one (Bini with the song) comes round every 5 days.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            narrators=(bini tula ollo dodo pipi)
            echo "name=${narrators[$(( $(date -u +%s) / 86400 % 5 ))]}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.character || 'bini' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system deps (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache Rhubarb Lip Sync
        id: rhubarb-cache
        uses: actions/cache@v5
        with:
          path: rhubarb
          key: rhubarb-1.14.0-linux

      - name: Download Rhubarb Lip Sync
        if: steps.rhubarb-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o rhubarb.zip "https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.14.0/Rhubarb-Lip-Sync-1.14.0-Linux.zip"
          mkdir -p rhubarb
          unzip -q rhubarb.zip -d rhubarb
          chmod +x rhubarb/Rhubarb-Lip-Sync-1.14.0-Linux/rhubarb

      - name: Cache Kokoro TTS model
        id: kokoro-cache
        uses: actions/cache@v5
        with:
          path: kokoro_model
          key: kokoro-v1.0-int8

      - name: Download Kokoro TTS model
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p kokoro_model
          curl -sL -o kokoro_model/kokoro-v1.0.int8.onnx "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx"
          curl -sL -o kokoro_model/voices-v1.0.bin "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin"

      - name: Install Python deps
        run: |
          pip install --quiet -r requirements.txt

      - name: Render episode
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SEABINI_RHUBARB: ${{ github.workspace }}/rhubarb/Rhubarb-Lip-Sync-1.14.0-Linux/rhubarb
          SEABINI_VOICE_ENGINE: kokoro
          SEABINI_KOKORO_MODEL: ${{ github.workspace }}/kokoro_model/kokoro-v1.0.int8.onnx
          SEABINI_KOKORO_VOICES: ${{ github.workspace }}/kokoro_model/voices-v1.0.bin
        run: |
          python bini_real_episode.py "${{ github.event.inputs.theme }}" episode.mp4 "${{ steps.narrator.outputs.name }}"

      - name: Publish (GitHub Release + manifest commit + Buffer social posts)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          cat episode_meta.json
          python seabini_publish.py episode.mp4 --meta episode_meta.json

      - name: Upload episode as workflow artifact (backup)
        uses: actions/upload-artifact@v6
        with:
          name: bini-real-ocean-episode
          path: episode.mp4
          retention-days: 7
