name: Bini's Real Ocean Daily Episode

on:
  schedule:
    # One episode per character per day, all deliberately off-hour (GitHub's
    # own docs warn crons pinned to :00 are most likely to be delayed/dropped
    # under platform-wide load) and irregularly spaced (not evenly divided)
    # across the day for both scheduling safety and audience-timezone spread.
    - cron: '15 2 * * *'    # ~02:15 UTC - Bini (with song)
    - cron: '40 6 * * *'    # ~06:40 UTC - Tula
    - cron: '55 10 * * *'   # ~10:55 UTC - Ollo
    - cron: '25 15 * * *'   # ~15:25 UTC - Dodo
    - cron: '10 20 * * *'   # ~20:10 UTC - Pipi
  workflow_dispatch:
    inputs:
      theme:
        description: 'Optional creature/theme seed'
        required: false
        default: ''
      character:
        description: 'Narrator: bini, tula, ollo, dodo, or pipi'
        required: false
        default: 'bini'

# Lets the automatic GITHUB_TOKEN create releases and commit the manifest.
permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine narrator for this run
        id: narrator
        run: |
          case "${{ github.event.schedule }}" in
            '15 2 * * *')  echo "name=bini" >> "$GITHUB_OUTPUT" ;;
            '40 6 * * *')  echo "name=tula" >> "$GITHUB_OUTPUT" ;;
            '55 10 * * *') echo "name=ollo" >> "$GITHUB_OUTPUT" ;;
            '25 15 * * *') echo "name=dodo" >> "$GITHUB_OUTPUT" ;;
            '10 20 * * *') echo "name=pipi" >> "$GITHUB_OUTPUT" ;;
            *) echo "name=${{ github.event.inputs.character || 'bini' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install system deps (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache Rhubarb Lip Sync
        id: rhubarb-cache
        uses: actions/cache@v4
        with:
          path: rhubarb
          key: rhubarb-1.14.0-linux

      - name: Download Rhubarb Lip Sync
        if: steps.rhubarb-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o rhubarb.zip "https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.14.0/Rhubarb-Lip-Sync-1.14.0-Linux.zip"
          mkdir -p rhubarb
          unzip -q rhubarb.zip -d rhubarb
          chmod +x rhubarb/Rhubarb-Lip-Sync-1.14.0-Linux/rhubarb

      - name: Cache Kokoro TTS model
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: kokoro_model
          key: kokoro-v1.0-int8

      - name: Download Kokoro TTS model
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p kokoro_model
          curl -sL -o kokoro_model/kokoro-v1.0.int8.onnx "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx"
          curl -sL -o kokoro_model/voices-v1.0.bin "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin"

      - name: Install Python deps
        run: |
          pip install --quiet moviepy==1.0.3 "pillow<10" imageio-ffmpeg "kokoro-onnx>=0.6.0"

      - name: Render episode
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SEABINI_RHUBARB: ${{ github.workspace }}/rhubarb/Rhubarb-Lip-Sync-1.14.0-Linux/rhubarb
          SEABINI_VOICE_ENGINE: kokoro
          SEABINI_KOKORO_MODEL: ${{ github.workspace }}/kokoro_model/kokoro-v1.0.int8.onnx
          SEABINI_KOKORO_VOICES: ${{ github.workspace }}/kokoro_model/voices-v1.0.bin
        run: |
          python bini_real_episode.py "${{ github.event.inputs.theme }}" episode.mp4 "${{ steps.narrator.outputs.name }}"

      - name: Publish (GitHub Release + manifest commit + Buffer social posts)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          TITLE=$(python -c "import json; print(json.load(open('episode_meta.json'))['title'])" 2>/dev/null || echo "Bini's Real Ocean")
          OBJ=$(python -c "import json; print(json.load(open('episode_meta.json'))['learning_objective'])" 2>/dev/null || echo "a real look at ocean life")
          SERIES=$(python -c "import json; print(json.load(open('episode_meta.json'))['series_title'])" 2>/dev/null || echo "Bini's Real Ocean")
          NARRATOR=$(python -c "import json; print(json.load(open('episode_meta.json'))['narrator'])" 2>/dev/null || echo "Bini")
          HOOK=$(python -c "import json; print(json.load(open('episode_meta.json')).get('search_hook',''))" 2>/dev/null || echo "")
          echo "Episode: $TITLE | $OBJ | narrator=$NARRATOR | hook=$HOOK"
          python seabini_publish.py episode.mp4 "$TITLE" en "$OBJ" "$SERIES" "$NARRATOR" "$HOOK"

      - name: Upload episode as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: bini-real-ocean-episode
          path: episode.mp4
          retention-days: 7
